name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["Update CDN Data", "Validate CCB"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # 数据任务会提交新快照，部署必须读取更新后的分支。
          ref: main
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Validate published snapshot
        run: |
          python script/build.py --check
          node --test script/tests/*.test.cjs
          node --check script/ccb.bundle.user.js
          python -m unittest discover -s script/tests -p 'test_*.py'
          go test update.go update_test.go
          npm run test:browser
      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0
      - name: Build static site
        run: |
          mkdir -p _site/api _site/script
          cp data/*.json _site/api/
          cp script/ccb.bundle.user.js script/ccb-legacy-2.2.0.user.js _site/script/
          cp docs/pages.html _site/index.html
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
